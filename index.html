<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nardelli Precios</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f2f2f2;
text-align:center;
}

header{
background:#c40000;
color:#fff;
padding:18px;
font-size:24px;
font-weight:bold;
}

main{
padding:15px;
max-width:520px;
margin:auto;
}

button{
width:100%;
padding:16px;
font-size:22px;
font-weight:bold;
border:none;
border-radius:12px;
background:#ffd400;
margin-bottom:15px;
}

#reader{
width:100%;
background:#fff;
border-radius:14px;
overflow:hidden;
}

.card{
background:#fff;
padding:18px;
border-radius:14px;
margin-top:15px;
box-shadow:0 4px 10px rgba(0,0,0,.12);
}

.precio{
font-size:46px;
font-weight:bold;
color:#c40000;
margin-top:10px;
}
.small{
font-size:15px;
color:#666;
}
</style>
</head>

<body>

<header>Nardelli Precios</header>

<main>

<button onclick="iniciar()">📷 Escanear Producto</button>

<div id="reader"></div>

<div id="resultado" class="card">
Esperando escaneo...
</div>

</main>

<script>

const API="https://script.google.com/macros/s/AKfycbx81plecIUhPbJrbdT4bJwccGL93wa18eVoHbGSUIzbyEbQZvbPC-X-VM2hULlyul5qsw/exec";

let qr;

function iniciar(){

document.getElementById("resultado").innerHTML="Abriendo cámara...";

qr = new Html5Qrcode("reader");

qr.start(
{ facingMode: "environment" },
{
fps: 10,
qrbox: { width: 280, height: 140 },
formatsToSupport: [
Html5QrcodeSupportedFormats.EAN_13,
Html5QrcodeSupportedFormats.EAN_8,
Html5QrcodeSupportedFormats.UPC_A,
Html5QrcodeSupportedFormats.UPC_E,
Html5QrcodeSupportedFormats.CODE_128
]
},
(codigo) => {

  qr.stop().then(() => {

    buscar(codigo.trim());

  }).catch(err => {
    console.log("Error al detener cámara:", err);
    buscar(codigo.trim());
  });

},
(errorMessage) => {}
).catch(err => {
document.getElementById("resultado").innerHTML=
"No se pudo abrir cámara";
});

}

function buscar(codigo){

document.getElementById("resultado").innerHTML="Buscando producto...";

fetch(API + "?codigo=" + encodeURIComponent(codigo))
.then(r=>r.json())
.then(data=>{

if(data.ok){

document.getElementById("resultado").innerHTML=`
<div><b>${data.nombre}</b></div>
<div class="small">Código interno: ${data.codigo}</div>
<div class="small">${data.categoria}</div>
<div class="precio">$ ${Number(data.precio).toLocaleString('es-AR',{minimumFractionDigits:2})}</div>
`;

}else{

document.getElementById("resultado").innerHTML=
"Producto no encontrado";

}

});

}

</script>

</body>
</html>
